<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">Daymark three-panel workspace</title><desc id="desc">An illustrative product interface diagram showing the memory index, central conversation, recall state, evidence rail and claim ledger.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171f2b"/><stop offset="1" stop-color="#0b0e13"/></linearGradient><linearGradient id="lime" x2="1" y2="1"><stop stop-color="#dcff96"/><stop offset="1" stop-color="#9fc85b"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:1.5px}.white{fill:#edf2f8}.muted{fill:#94a1b2}.lime{fill:#c8f169}.purple{fill:#b2a4ff}.cyan{fill:#8fe1dc}.amber{fill:#edc681}.panel{fill:#111820;stroke:#344151;stroke-width:1.5}.card{fill:#1a2430;stroke:#39495b}</style></defs>
<rect width="1440" height="860" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1438" height="858" rx="23" fill="none" stroke="#394658"/>
<rect x="28" y="24" width="36" height="36" rx="10" fill="url(#lime)"/><text x="46" y="49" text-anchor="middle" fill="#11170b" font-size="21" font-weight="800">D</text><text x="78" y="43" class="white" font-size="19" font-weight="700">daymark<tspan class="lime">/</tspan></text><text x="78" y="58" class="muted mono" font-size="8">TEMPORAL RESEARCH INSTRUMENT</text><rect x="1244" y="29" width="160" height="27" rx="13" fill="#17251b" stroke="#536b3d"/><circle cx="1261" cy="42.5" r="4" fill="#c8f169"/><text x="1274" y="46" class="lime mono" font-size="9">LOCAL WORKSPACE</text>
<text x="34" y="112" class="lime mono" font-size="10">MEMORY / TIME / EVIDENCE</text><text x="34" y="157" class="white" font-size="38" font-weight="700">What was true. <tspan class="purple">What is true now.</tspan></text><text x="36" y="185" class="muted" font-size="14">A dated research conversation with its history, sources and tracked claims in one place.</text>
<rect x="34" y="222" width="250" height="565" rx="15" class="panel"/><text x="56" y="257" class="muted mono" font-size="10">MEMORY INDEX</text><text x="254" y="257" text-anchor="end" class="muted mono" font-size="9">03</text>
<rect x="50" y="279" width="218" height="94" rx="9" fill="#201d31" stroke="#675d95"/><text x="65" y="302" class="purple mono" font-size="9">03 NOV 2026</text><text x="65" y="329" class="white" font-size="12" font-weight="600">Postgres hosting</text><text x="65" y="348" class="muted" font-size="10">Compare plans and pricing…</text>
<rect x="50" y="383" width="218" height="77" rx="9" class="card"/><text x="65" y="406" class="purple mono" font-size="9">09 NOV 2026</text><text x="65" y="431" class="white" font-size="12" font-weight="600">CRM shortlist</text><text x="65" y="446" class="muted" font-size="10">Five tools for a sales team…</text>
<rect x="50" y="470" width="218" height="77" rx="9" class="card"/><text x="65" y="493" class="purple mono" font-size="9">11 NOV 2026</text><text x="65" y="518" class="white" font-size="12" font-weight="600">Node.js LTS</text><text x="65" y="533" class="muted" font-size="10">Release and support status…</text>
<path d="M50 572h218" stroke="#303d4c"/><text x="56" y="599" class="muted mono" font-size="9">TEST INSTRUMENTS</text>
<rect x="50" y="615" width="218" height="54" rx="8" class="card"/><text x="65" y="636" class="lime mono" font-size="8">01 / TEMPORAL DELTA</text><text x="65" y="655" class="white" font-size="11">Recheck a shortlist</text><rect x="50" y="679" width="218" height="54" rx="8" class="card"/><text x="65" y="700" class="lime mono" font-size="8">02 / HISTORICAL RECALL</text><text x="65" y="719" class="white" font-size="11">Revisit an earlier date</text>
<rect x="302" y="222" width="735" height="565" rx="15" class="panel"/><text x="328" y="257" class="muted mono" font-size="10">CONVERSATION / 7F2A…</text><text x="1009" y="257" text-anchor="end" class="cyan mono" font-size="9">● RECEIPTS SAVED</text>
<rect x="334" y="285" width="610" height="102" rx="10" fill="#211f32" stroke="#5e548a"/><text x="355" y="311" class="purple mono" font-size="9">YOU / FOLLOW-UP</text><text x="355" y="343" class="white" font-size="15" font-weight="600">What did we compare about Postgres hosting last time?</text><text x="355" y="368" class="white" font-size="15" font-weight="600">Has anything changed since then?</text>
<text x="350" y="423" class="muted mono" font-size="9">DAYMARK / RESEARCH NOTE</text><text x="350" y="452" class="white" font-size="13">I found the earlier Postgres discussion and selected its date</text><text x="350" y="474" class="white" font-size="13">as the baseline. I will compare current provider pages with</text><text x="350" y="496" class="white" font-size="13">dated updates published after that point.</text><rect x="350" y="519" width="565" height="1" fill="#344150"/><text x="350" y="547" class="cyan" font-size="12">Current pages and post-baseline sources are reviewed separately.</text><text x="350" y="575" class="white" font-size="12">A missing result is not evidence that nothing changed. <tspan class="lime">[1]</tspan></text><rect x="350" y="594" width="565" height="64" rx="8" fill="#17212b" stroke="#354454"/><text x="369" y="618" class="muted mono" font-size="9">SOURCE-AWARE RESPONSE</text><text x="369" y="640" class="muted" font-size="11">Citation markers open the source receipts on the right.</text>
<rect x="326" y="680" width="687" height="79" rx="11" fill="#0d1218" stroke="#354252"/><text x="349" y="709" class="muted" font-size="12">Ask a question, compare options, or revisit an earlier answer…</text><rect x="902" y="698" width="91" height="42" rx="8" fill="url(#lime)"/><text x="947" y="724" text-anchor="middle" fill="#17200e" font-size="11" font-weight="700">Research ↗</text>
<rect x="1055" y="222" width="350" height="565" rx="15" class="panel"/><text x="1077" y="257" class="muted mono" font-size="10">RECALL STATE</text><g transform="translate(1075 278)"><rect width="148" height="62" rx="8" class="card"/><text x="14" y="29" class="white" font-size="20" font-weight="700">04</text><text x="14" y="47" class="muted mono" font-size="8">TURNS RECALLED</text><rect x="159" width="148" height="62" rx="8" class="card"/><text x="173" y="29" class="white" font-size="20" font-weight="700">06</text><text x="173" y="47" class="muted mono" font-size="8">SEARCH REQUESTS</text></g>
<rect x="1075" y="354" width="308" height="38" rx="7" fill="#201d31" stroke="#62588c"/><text x="1089" y="377" class="purple mono" font-size="9">BASELINE / 03 NOV 2026</text>
<text x="1077" y="425" class="muted mono" font-size="10">EVIDENCE RAIL</text><g transform="translate(1075 440)"><rect width="308" height="66" rx="8" class="card"/><rect x="11" y="11" width="26" height="22" rx="5" fill="#26371f" stroke="#637e43"/><text x="24" y="26" text-anchor="middle" class="lime mono" font-size="9">[1]</text><text x="48" y="25" class="white" font-size="11" font-weight="600">Official pricing page</text><text x="48" y="43" class="muted mono" font-size="8">CURRENT · PUBLICATION DATE?</text><rect x="248" y="11" width="49" height="22" rx="5" fill="#1b2b25" stroke="#416d5a"/><text x="272" y="26" text-anchor="middle" class="cyan mono" font-size="8">LIVE</text></g>
<g transform="translate(1075 514)"><rect width="308" height="66" rx="8" class="card"/><rect x="11" y="11" width="26" height="22" rx="5" fill="#302947" stroke="#6e62a5"/><text x="24" y="26" text-anchor="middle" class="purple mono" font-size="9">[2]</text><text x="48" y="25" class="white" font-size="11" font-weight="600">Product release note</text><text x="48" y="43" class="muted mono" font-size="8">SINCE BASELINE · DATED</text><rect x="248" y="11" width="49" height="22" rx="5" fill="#28243c" stroke="#5f568e"/><text x="272" y="26" text-anchor="middle" class="purple mono" font-size="8">SINCE</text></g>
<text x="1077" y="614" class="muted mono" font-size="10">CLAIM LEDGER</text><rect x="1075" y="629" width="308" height="112" rx="8" class="card"/><text x="1090" y="653" class="white" font-size="12" font-weight="700">Tracked price claim</text><rect x="1090" y="665" width="278" height="25" rx="5" fill="#272318" stroke="#79613d"/><text x="1229" y="682" text-anchor="middle" class="amber mono" font-size="8">SUPPORT CHECK REQUIRED</text><text x="1090" y="715" class="muted" font-size="10">Claim extraction is price-only and heuristic.</text>
<text x="35" y="827" class="muted mono" font-size="9">ILLUSTRATIVE UI DIAGRAM · SAMPLE MESSAGES, COUNTS AND RECEIPTS · NOT LIVE SEARCH OUTPUT</text><text x="1405" y="827" text-anchor="end" class="lime mono" font-size="9">DAYMARK / EVIDENCE BEFORE CONFIDENCE</text>
</svg>