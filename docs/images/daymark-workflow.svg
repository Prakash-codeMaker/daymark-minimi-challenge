<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Daymark: from old question to evidence-backed recheck</title>
<desc id="desc">Animated four-stage product workflow: recall a past question, replay searches against current and since-baseline sources, compare outcomes, and inspect evidence receipts.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1b2635"/><stop offset="1" stop-color="#0b0e13"/></linearGradient>
 <linearGradient id="lime" x2="1" y2="1"><stop stop-color="#dcff96"/><stop offset="1" stop-color="#9fc85b"/></linearGradient>
 <style>
  text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:2px}.muted{fill:#97a4b5}.white{fill:#edf2f8}.lime{fill:#c8f169}.purple{fill:#b2a4ff}.cyan{fill:#8fe1dc}.amber{fill:#edc681}.panel{fill:#141c26;stroke:#354252;stroke-width:1.5}.card{fill:#1a2430;stroke:#3a495b}
  .stage{opacity:0}.s1{animation:one 36s infinite}.s2{animation:two 36s infinite}.s3{animation:three 36s infinite}.s4{animation:four 36s infinite}
  @keyframes one{0%,23%{opacity:1}25%,100%{opacity:0}}@keyframes two{0%,24%{opacity:0}26%,48%{opacity:1}50%,100%{opacity:0}}@keyframes three{0%,49%{opacity:0}51%,73%{opacity:1}75%,100%{opacity:0}}@keyframes four{0%,74%{opacity:0}76%,98%{opacity:1}100%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.stage{animation:none!important}.s1{opacity:1}}
 </style>
</defs>
<rect width="1200" height="675" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="25" fill="none" stroke="#394658"/>
<rect x="28" y="27" width="33" height="33" rx="10" fill="url(#lime)"/><text x="44.5" y="50" text-anchor="middle" fill="#11170b" font-size="20" font-weight="800">D</text>
<text x="74" y="44" class="white" font-size="18" font-weight="700">daymark<tspan class="lime">/</tspan></text><text x="74" y="59" class="muted mono" font-size="8">TEMPORAL RESEARCH INSTRUMENT</text>
<rect x="904" y="29" width="261" height="27" rx="13" fill="#18251a" stroke="#566b40"/><circle cx="922" cy="42.5" r="4" fill="#c8f169"/><text x="935" y="46" class="lime mono" font-size="8.5">ILLUSTRATIVE PRODUCT WORKFLOW</text>
<text x="38" y="112" class="muted mono" font-size="10">ONE QUESTION · FOUR STEPS · A TRACEABLE ANSWER</text>
<g transform="translate(38 133)">
 <g><rect width="270" height="45" rx="10" class="panel"/><circle cx="22" cy="22" r="11" fill="#26351f" stroke="#738c4c"/><text x="22" y="26" text-anchor="middle" class="lime" font-size="11" font-weight="700">1</text><text x="43" y="19" class="white" font-size="12" font-weight="700">Remember</text><text x="43" y="33" class="muted" font-size="9">Recover the earlier question</text></g>
 <g transform="translate(281)"><rect width="270" height="45" rx="10" class="panel"/><circle cx="22" cy="22" r="11" fill="#1c3035" stroke="#4d8c91"/><text x="22" y="26" text-anchor="middle" class="cyan" font-size="11" font-weight="700">2</text><text x="43" y="19" class="white" font-size="12" font-weight="700">Search again</text><text x="43" y="33" class="muted" font-size="9">Check current + since baseline</text></g>
 <g transform="translate(562)"><rect width="270" height="45" rx="10" class="panel"/><circle cx="22" cy="22" r="11" fill="#302a1d" stroke="#987c48"/><text x="22" y="26" text-anchor="middle" class="amber" font-size="11" font-weight="700">3</text><text x="43" y="19" class="white" font-size="12" font-weight="700">Compare</text><text x="43" y="33" class="muted" font-size="9">Separate change from uncertainty</text></g>
 <g transform="translate(843)"><rect width="270" height="45" rx="10" class="panel"/><circle cx="22" cy="22" r="11" fill="#28243b" stroke="#7567ac"/><text x="22" y="26" text-anchor="middle" class="purple" font-size="11" font-weight="700">4</text><text x="43" y="19" class="white" font-size="12" font-weight="700">Show evidence</text><text x="43" y="33" class="muted" font-size="9">Keep receipts beside the answer</text></g>
</g>
<rect x="38" y="203" width="1124" height="410" rx="18" class="panel"/>
<g class="stage s1">
 <text x="72" y="248" class="lime mono" font-size="10">01 / MEMORY MATCH</text><text x="72" y="291" class="white" font-size="29" font-weight="700">Start with the question you asked before.</text><text x="72" y="320" class="muted" font-size="14">Saved conversation turns become a dated baseline for the next check.</text>
 <rect x="72" y="358" width="680" height="184" rx="14" class="card"/><text x="98" y="391" class="purple mono" font-size="10">03 NOV 2026 · SAVED QUESTION</text><text x="98" y="433" class="white" font-size="20" font-weight="600">“Compare PostgreSQL hosting options</text><text x="98" y="461" class="white" font-size="20" font-weight="600">for my side project.”</text>
 <rect x="98" y="489" width="112" height="25" rx="6" fill="#202c3a" stroke="#46576b"/><text x="154" y="505" text-anchor="middle" class="muted" font-size="9">Original query</text><rect x="220" y="489" width="108" height="25" rx="6" fill="#202c3a" stroke="#46576b"/><text x="274" y="505" text-anchor="middle" class="muted" font-size="9">Source trail</text><rect x="336" y="489" width="112" height="25" rx="6" fill="#202c3a" stroke="#46576b"/><text x="392" y="505" text-anchor="middle" class="muted" font-size="9">Saved date</text>
 <rect x="790" y="358" width="332" height="184" rx="14" fill="#201d31" stroke="#62588f"/><text x="816" y="391" class="purple mono" font-size="10">TODAY / FOLLOW-UP</text><text x="816" y="433" class="white" font-size="17" font-weight="600">“Has anything important</text><text x="816" y="458" class="white" font-size="17" font-weight="600">changed since then?”</text><path d="M816 490h265" stroke="#62588f"/><text x="816" y="516" class="muted" font-size="11">No need to retell the whole story.</text>
</g>
<g class="stage s2">
 <text x="72" y="248" class="cyan mono" font-size="10">02 / RESEARCH REPLAY</text><text x="72" y="291" class="white" font-size="29" font-weight="700">Search the present and the time in between.</text><text x="72" y="320" class="muted" font-size="14">The old query is replayed in two separate search lanes.</text>
 <rect x="72" y="358" width="500" height="184" rx="14" class="card"/><text x="100" y="395" class="white" font-size="18" font-weight="700">Current pages</text><text x="100" y="418" class="muted" font-size="12">What the provider pages say now</text>
 <rect x="100" y="449" width="126" height="43" rx="8" fill="#10271f" stroke="#2b8a67"/><text x="163" y="476" text-anchor="middle" fill="#7ce5b8" font-size="14" font-weight="700">Supabase</text><rect x="240" y="449" width="110" height="43" rx="8" fill="#102c25" stroke="#278c75"/><text x="295" y="476" text-anchor="middle" fill="#74efd0" font-size="14" font-weight="700">Neon</text><text x="100" y="520" class="cyan mono" font-size="9">CHECK CURRENT STATE</text>
 <rect x="600" y="358" width="522" height="184" rx="14" class="card"/><text x="628" y="395" class="white" font-size="18" font-weight="700">Published since 03 Nov</text><text x="628" y="418" class="muted" font-size="12">Look for dated releases and announcements</text>
 <rect x="628" y="449" width="110" height="43" rx="8" fill="#22213b" stroke="#655aa3"/><text x="683" y="476" text-anchor="middle" fill="#b9adff" font-size="14" font-weight="700">Neon</text><rect x="752" y="449" width="120" height="43" rx="8" fill="#242933" stroke="#596b7c"/><text x="812" y="476" text-anchor="middle" class="white" font-size="14" font-weight="700">Railway</text><text x="628" y="520" class="purple mono" font-size="9">LOOK FOR NEW SIGNALS</text>
 <text x="72" y="582" class="muted" font-size="11">Provider names identify illustrative search targets—not actual findings or current product claims.</text>
</g>
<g class="stage s3">
 <text x="72" y="248" class="amber mono" font-size="10">03 / EVIDENCE COMPARISON</text><text x="72" y="291" class="white" font-size="29" font-weight="700">A search result is not automatically a change.</text><text x="72" y="320" class="muted" font-size="14">Daymark keeps three outcomes separate instead of filling gaps with confidence.</text>
 <g transform="translate(72 364)"><rect width="330" height="142" rx="14" fill="#18251b" stroke="#587643"/><circle cx="30" cy="34" r="14" fill="#29402a"/><text x="30" y="39" text-anchor="middle" class="lime" font-size="17">✓</text><text x="58" y="39" class="lime" font-size="17" font-weight="700">Still supported</text><text x="25" y="83" class="white" font-size="13">Evidence continues to support</text><text x="25" y="104" class="white" font-size="13">the earlier statement.</text></g>
 <g transform="translate(435 364)"><rect width="330" height="142" rx="14" fill="#272116" stroke="#82683e"/><circle cx="30" cy="34" r="14" fill="#49371e"/><text x="30" y="39" text-anchor="middle" class="amber" font-size="17">↗</text><text x="58" y="39" class="amber" font-size="17" font-weight="700">Changed</text><text x="25" y="83" class="white" font-size="13">A dated source supports a</text><text x="25" y="104" class="white" font-size="13">different value or state.</text></g>
 <g transform="translate(798 364)"><rect width="324" height="142" rx="14" fill="#211f32" stroke="#655b91"/><circle cx="30" cy="34" r="14" fill="#363051"/><text x="30" y="39" text-anchor="middle" class="purple" font-size="17">?</text><text x="58" y="39" class="purple" font-size="17" font-weight="700">Unverifiable</text><text x="25" y="83" class="white" font-size="13">Evidence is incomplete. Keep</text><text x="25" y="104" class="white" font-size="13">the uncertainty visible.</text></g>
 <rect x="72" y="532" width="1050" height="39" rx="8" fill="#272318" stroke="#665a3b"/><text x="96" y="556" class="amber mono" font-size="11">GUARDRAIL / NO RESULT FOUND ≠ PROOF THAT NOTHING CHANGED</text>
</g>
<g class="stage s4">
 <text x="72" y="248" class="purple mono" font-size="10">04 / EVIDENCE RAIL</text><text x="72" y="291" class="white" font-size="29" font-weight="700">Keep the receipts beside the answer.</text><text x="72" y="320" class="muted" font-size="14">Open numbered sources and inspect the context behind a tracked claim.</text>
 <rect x="72" y="356" width="710" height="190" rx="14" class="card"/><text x="98" y="389" class="muted mono" font-size="9">SOURCE RECEIPTS / EXAMPLE LAYOUT</text>
 <g transform="translate(98 405)"><rect width="658" height="39" rx="7" fill="#202c39" stroke="#435467"/><rect x="12" y="8" width="25" height="23" rx="5" fill="#25381d" stroke="#667e45"/><text x="24.5" y="24" text-anchor="middle" class="lime mono" font-size="9">[1]</text><text x="50" y="17" class="white" font-size="12" font-weight="600">Official provider pricing page</text><text x="50" y="30" class="muted" font-size="8">CURRENT PAGE · PUBLISH DATE WHEN AVAILABLE</text><text x="590" y="24" class="cyan mono" font-size="9">CURRENT</text></g>
 <g transform="translate(98 452)"><rect width="658" height="39" rx="7" fill="#202c39" stroke="#435467"/><rect x="12" y="8" width="25" height="23" rx="5" fill="#302947" stroke="#6e62a5"/><text x="24.5" y="24" text-anchor="middle" class="purple mono" font-size="9">[2]</text><text x="50" y="17" class="white" font-size="12" font-weight="600">Product changelog or release note</text><text x="50" y="30" class="muted" font-size="8">DATED UPDATE · AFTER THE BASELINE</text><text x="590" y="24" class="purple mono" font-size="9">SINCE</text></g>
 <rect x="810" y="356" width="312" height="190" rx="14" fill="#1d2025" stroke="#535b68"/><text x="836" y="389" class="muted mono" font-size="9">CLAIM LEDGER</text><text x="836" y="426" class="white" font-size="17" font-weight="700">Price claim</text><rect x="836" y="443" width="260" height="29" rx="6" fill="#272116" stroke="#806843"/><text x="966" y="462" text-anchor="middle" class="amber mono" font-size="9">SUPPORT CHECK REQUIRED</text><text x="836" y="503" class="muted" font-size="10">A citation pointer is not proof.</text><text x="836" y="520" class="muted" font-size="10">Inspect the returned source excerpt.</text>
</g>
<text x="40" y="646" class="muted mono" font-size="9">DAYMARK / EVIDENCE BEFORE CONFIDENCE</text><text x="1160" y="646" text-anchor="end" class="muted mono" font-size="9">ILLUSTRATIVE EXAMPLE · NOT LIVE SEARCH OUTPUT</text>
</svg>